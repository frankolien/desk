# XcodeGen is the source of truth; Desk.xcodeproj is generated and git-ignored.
#   xcodegen generate && open Desk.xcodeproj
name: Desk
options:
  bundleIdPrefix: com.opia
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YCKKUWB4WD
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  DeskKit:
    path: DeskKit

targets:
  Desk:
    type: application
    platform: iOS
    sources:
      - path: App/Desk
    dependencies:
      - package: DeskKit
        product: DeskMoney
      - package: DeskKit
        product: DeskAuth
      - package: DeskKit
        product: DeskNet
      - package: DeskKit
        product: DeskChain
      - package: DeskKit
        product: DeskPerpl
      - package: DeskKit
        product: DeskFlow
      - package: DeskKit
        product: DeskUI
    entitlements:
      path: App/Desk/Desk.entitlements
      properties:
        # Must match `DeskApp.relyingPartyIdentifier` exactly. Two copies of one string,
        # because iOS cannot read its own entitlement at run time and a custom
        # INFOPLIST_KEY silently never reaches the built plist. `tools/check-relying-party.sh`
        # with no arguments compares them and then checks the domain itself.
        #
        # Without this entitlement the ceremony fails on device with no useful message,
        # because the association is checked by the system rather than by the app.
        com.apple.developer.associated-domains:
          # No `?mode=developer`. Apple's CDN already serves this domain's association
          # file — checked directly at app-site-association.cdn-apple.com — so the
          # developer bypass would only add a requirement (a Settings toggle) without
          # fixing anything, and it must not ship.
          - webcredentials:desk-trading-opia.vercel.app
        # Trade alerts. Automatic signing turns this into "production" for TestFlight.
        aps-environment: development
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.opia.desk
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Dark only. A trading app on a near-black ground has no light mode to test, and
        # in thirty-one days an untested one is a liability rather than a feature.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Desk saves the trade cards you choose to keep.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Desk derives your trading key from your face. Nothing is stored.
